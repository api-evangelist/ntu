- aid: ntu:ntu-identity-federation
  name: NTU Identity Provider — SGAF / eduGAIN
  description: >-
    NTU's SAML 2.0 identity provider, registered in the Singapore Access Federation (SGAF) by SingAREN
    and interfederated into eduGAIN, asserting the scope ntu.edu.sg. Live machine-readable SAML metadata
    with an IDPSSODescriptor and an AttributeAuthorityDescriptor. This is the surface class universities
    operate that almost never gets catalogued, and it is a genuine institutional fact — but the entityID
    and endpoints are on SingAREN's federation proxy, not on ntu.edu.sg, so it is recorded as a tenancy
    rather than as NTU-operated infrastructure.
  x-operator: tenant
  x-operator-evidence: >-
    eduGAIN entity 879352, federation code SGAF, registration authority https://www.singaren.net.sg, scope
    "ntu-entra.singaren.net.sg==ntu.edu.sg". The metadata signing certificate is issued to SingAREN (CN
    sgaf.singaren.net.sg). A superseded entity 879351 is still published, labelled "Legacy AD FS - DO
    NOT USE".
  humanURL: https://technical.edugain.org/entities
