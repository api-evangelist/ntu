description: >-
  Nanyang Technological University (NTU Singapore) is an autonomous public research university in
  Singapore, ranked in the top 15 of the QS World University Rankings. Its programmable footprint is
  small, indirect, and almost entirely research-infrastructure: NTU operates no public developer
  portal, publishes no API key self-service, and exposes no OAuth or OIDC authorization server on
  any host it owns. Exactly one machine-readable API is genuinely NTU-operated — DR-NTU (Data), a
  Dataverse 6.1 open research data repository that NTU self-hosts on its own network
  (researchdata.ntu.edu.sg CNAMEs to dataverse.ntu.edu.sg at 155.69.19.238, registered to Nanyang
  Technological University), backed by NTU's own DataCite client GDCC.NTU with 3,625 DOIs under
  prefix 10.21979. Everything else that carries NTU's name is a tenancy on someone else's platform.
  DR-NTU (Digital Repository), the far larger surface with 158,100 research profiles, a DSpace 7
  REST API and a fully conformant OAI-PMH endpoint, answers on dr.ntu.edu.sg but CNAMEs to
  ntu-cris.4science.cloud — NTU's data and NTU's library administration running on 4Science's
  DSpace-CRIS platform. NTU's federated single sign-on is a live SAML 2.0 identity provider in
  eduGAIN, but the entityID and endpoints sit on SingAREN's SGAF proxy, not on ntu.edu.sg. NTU owns
  a live API gateway at api.ntu.edu.sg which returns a structured JSON 404 on every path and
  documents no route at all. This profile records the tenancies as the real institutional facts they
  are, and credits NTU only for what NTU actually operates.
