x-coverage:
  state: unreadable
  reason: >-
    The single institution-operated API in this profile is behind an edge bot-management gate that
    returns 403 to every automated client, so its contract could not be re-read on this run. The
    profile is otherwise thin because NTU genuinely publishes very little: no developer portal, no
    API documentation of its own, and no institution-operated API beyond its research data
    repository.
  detail: >-
    researchdata.ntu.edu.sg (DR-NTU (Data), the one x-operator: institution surface) returns an
    Apache 403 with a Citrix bot-management cookie and a /trap.html honeypot link on EVERY path,
    including the site root and robots.txt. Retrying with a browser User-Agent and a persisted
    cookie jar did not clear it. This is a block on us, not a decommissioned service: NTU's DataCite
    client minted a DOI on 2026-08-17, two days before this profile, and re3data independently
    lists the REST, OAI-PMH and SWORD endpoints as current. The archived contract in
    openapi/_original/ntu-drntu-data.yaml is therefore retained and the two refined specs kept, but
    marked unverified in authentication/ and errors/. A re-probe from a different vantage should
    upgrade this to covered. Every other surface WAS read live: dr.ntu.edu.sg answered 200 on
    /server/api and on OAI-PMH Identify and ListMetadataFormats, the SGAF SAML metadata returned
    200 application/samlmetadata+xml, and eduGAIN, DataCite and re3data all answered. Four of the
    six OpenAPIs previously in this repo were removed: refine-openapis had merged three source
    specs spanning two different hosts by tag and stamped all six with the first spec's server, so
    the DSpace paths (/, /core/items/{uuid}, /discover/search/objects) and the OAI-PMH /request
    path were all asserting researchdata.ntu.edu.sg as their host, which never served them.
