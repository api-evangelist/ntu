  - standard: oai-pmh
    name: Open Archives Initiative Protocol for Metadata Harvesting 2.0
    status: conformant
    x-operator: tenant
    host: dr.ntu.edu.sg
    evidence:
      - url: https://dr.ntu.edu.sg/oai/request?verb=Identify
        status: 200
        detail: >-
          Live OAI-PMH 2.0 Identify response. repositoryName "DR-NTU (Digital Repository of NTU)",
          baseURL https://dr.ntu.edu.sg/server/oai/request, protocolVersion 2.0,
          adminEmail library@ntu.edu.sg, earliestDatestamp 2008-05-15T02:56:52Z,
          repositoryIdentifier dr.ntu.edu.sg, granularity YYYY-MM-DDThh:mm:ssZ.
      - url: https://dr.ntu.edu.sg/oai/request?verb=ListMetadataFormats
        status: 200
        detail: >-
          11 metadata prefixes served: oai_dc, qdc, mods, mets, didl, ore, rdf, marc, dim,
          etdms, uketd_dc.
      - url: https://dr.ntu.edu.sg/server/oai/openairecris?verb=Identify
        status: 200
        detail: >-
          Second OAI-PMH base declaring OpenAIRE CERIF-CRIS 1.1 compatibility
          (openaire.eu/cerif-profile/vocab/OpenAIRE_Service_Compatibility#1.1).
    operator_note: >-
      The protocol endpoint answers on NTU's own hostname, but dr.ntu.edu.sg CNAMEs to
      ntu-cris.4science.cloud. The OAI-PMH implementation is DSpace-CRIS's, operated by 4Science.
      NTU's library administers the content and is the adminEmail of record.

