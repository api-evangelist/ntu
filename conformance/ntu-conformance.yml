          scope "ntu-entra.singaren.net.sg==ntu.edu.sg", roles IDPSSODescriptor +
          AttributeAuthorityDescriptor, first seen 2026-04-29.
    operator_note: >-
      NTU's federated identity is real and interfederated into eduGAIN, but the entityID and the
