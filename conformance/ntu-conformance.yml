          probe, not a decommissioned endpoint.
      - url: https://www.re3data.org/api/v1/repository/r3d100012440
        status: 200
        detail: >-
          Independent registry record for DR-NTU (Data) declares
          <r3d:api apiType="OAI-PMH">https://researchdata.ntu.edu.sg/oai?verb=Identify</r3d:api>.
    operator_note: >-
      NOT counted as a verified conformance. Recorded as declared-unverified because the only
      evidence is a third-party registry, and the endpoint itself could not be reached from here.

