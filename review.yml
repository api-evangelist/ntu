- date: '2026-08-19'
  rating: 2
  summary: 'University-pipeline re-profile with operator attribution. The June 2026 review treated both
    NTU repositories as NTU''s APIs; DNS settles that they are not the same thing. researchdata.ntu.edu.sg
    CNAMEs to dataverse.ntu.edu.sg at 155.69.19.238, whois org-name Nanyang Technological University
    — NTU self-hosts that Dataverse, so it is x-operator: institution and the only API NTU actually
    operates. dr.ntu.edu.sg CNAMEs to ntu-cris.4science.cloud — the larger DSpace-CRIS repository and
    its OAI-PMH endpoint are NTU''s data on 4Science''s platform, so they are x-operator: tenant and
    no OpenAPI is registered under NTU for them. A previously uncatalogued surface was found: NTU''s
    SAML 2.0 identity provider, eduGAIN entity 879352 registered by SingAREN under the SGAF federation
    with scope ntu.edu.sg — also tenant, because the entityID lives on SingAREN''s proxy. api.ntu.edu.sg
    is a live NTU-owned gateway that 404s a JSON envelope on every path and documents no route. Four
    of the six OpenAPIs in this repo were removed as host-collision fabrications: refine-openapis had
    merged three source specs across two hosts by tag and stamped all six with the first spec''s servers[],
    so DSpace paths were asserting researchdata.ntu.edu.sg as their host. researchdata.ntu.edu.sg could
    not be re-probed — Citrix bot management returns 403 on every path including robots.txt — but DataCite
    shows a DOI minted 2026-08-17, so it is blocked to us, not dead. Rating lowered because the corrected
    institution-operated footprint is one API with two read operations, not six APIs. That is the honest
    number.'
